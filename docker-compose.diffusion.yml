version: "3.9"

services:
  neuro-all:
    image: neuroidss/neuro_heterarchy_diffusion:latest
    container_name: neuro_diffusion_local
    working_dir: /app
    network_mode: host
    ipc: host
    shm_size: "4gb"
    environment:
      - HF_HOME=/workspace/hf_cache
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.cache/huggingface:/workspace/hf_cache
      - .:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      bash -c "
      mkdir -p /workspace/hf_cache /workspace/logs &&
      python3 -u /app/brain_server.py --mode lcm &
      python3 -u /app/web_cloud_gateway.py --port 8080 --cert /app/cert.pem --key /app/key.pem --music-lore /app/lore/music_lore.txt --lore /app/lore/world_lore.txt &
      sleep 3 &&
      python3 -u /app/neuro_heterarchy_diffusion.py --headless --mode lcm --steps 2 --lore /app/lore/world_lore.txt &
      wait
      "
