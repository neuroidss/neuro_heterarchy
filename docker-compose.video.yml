version: "3.9"

services:
  neuro-video:
    build:
      context: .
      dockerfile: Dockerfile.video
    image: neuroidss/neuro_heterarchy_video:latest
    container_name: neuro_video_local
    working_dir: /app
    network_mode: host
    ipc: host
    shm_size: "4gb"
    environment:
      - HF_HOME=/workspace/hf_cache
      - PYTHONUNBUFFERED=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - ~/.cache/huggingface:/workspace/hf_cache
      - .:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      bash -c "
      mkdir -p /workspace/hf_cache /workspace/logs &&
      python3 -u /app/video_world_server.py --port 6006 --model distilled --quant nf4 --vae-tile-min 256 --allow-t5-offload &
      python3 -u /app/web_cloud_gateway.py --port 8080 --cert /app/cert.pem --key /app/key.pem --video-lore /app/configs/mode_05_wm_control_test_arena.json &
      sleep 5 &&
      python3 -u /app/neuro_heterarchy_video.py --headless --mode ball --video-port 6006 --context-latents 1 --step-latents 2 --steps 8 --cfg 1.0 --stochastic 0.0 --wm-radius 0.35 --eeg-wm-gain 0.0 --gamepad-wm-mix 1.0 &
      wait
      "
